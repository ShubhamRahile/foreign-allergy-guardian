version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=foreign_allergy_guardian
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py migrate && python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-docker-secret-key-182391283
      - DATABASE_URL=postgres://postgres:postgres@db:5432/foreign_allergy_guardian
      - OFF_USER_AGENT=ForeignAllergyGuardian/1.0 (contact@foreignallergyguardian.com)
    depends_on:
      - db

volumes:
  postgres_data:
